<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINOLOGY Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><div class="brand">MINOLOGY / ADMIN</div></header><div class="panel"><label>Admin password</label><input class="field" id="pw" type="password"><button class="primary" id="load">OPEN ADMIN</button></div><div id="out"></div></div><script>
let H=()=>({"Content-Type":"application/json","X-Admin-Password":document.querySelector("#pw").value});
async function call(url,opts={}){let r=await fetch(url,{...opts,headers:{...H(),...(opts.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
document.querySelector("#load").onclick=async()=>{try{let d=await call("/api/admin/overview");document.querySelector("#out").innerHTML=`<div class="grid"><div class="panel">Users <div class="big">${d.users}</div></div><div class="panel">Pending withdrawals <div class="big">${d.pending}</div></div></div><div class="panel"><b>Create task</b><input class="field" id="title" placeholder="Task title"><input class="field" id="url" placeholder="Telegram channel URL"><input class="field" id="channel" placeholder="@channel username"><input class="field" id="reward" type="number" placeholder="Reward"><button class="primary" id="add">ADD TASK</button></div><div class="panel"><b>Withdrawal requests</b>${d.withdrawals.map(w=>`<p>#${w.id} · ${w.amount} · ${w.status}<br><span class="small">${w.wallet}</span> ${w.status==="pending"?`<button onclick="status(${w.id},'approved')">Approve</button> <button onclick="status(${w.id},'rejected')">Reject</button>`:""}</p>`).join("")}</div>`;
document.querySelector("#add").onclick=async()=>{await call("/api/admin/tasks",{method:"POST",body:JSON.stringify({title:title.value,url:url.value,channel:channel.value,reward:Number(reward.value)})});alert("Task created");document.querySelector("#load").click()}}catch(e){alert(e.message)}};
async function status(id,s){await call("/api/admin/withdrawals/"+id,{method:"POST",body:JSON.stringify({status:s})});document.querySelector("#load").click()}
</script></body></html>
